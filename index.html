<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazenda Universitária - Jogo de Agricultura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🚜 Minha Fazenda GrowTech</h1>
        <div id="painel">
            <span class="status-item moedas">🪙 Moedas: <span id="moedas-valor">15</span></span>
            <span class="status-item nivel">⭐ Nível: <span id="nivel-valor">1</span></span>
        </div>
    </header>

    <main>
        <section id="loja">
            <h2>Loja de Sementes</h2>
            <div class="opcoes-loja">
                <button class="btn-semente ativa" onclick="selecionarSemente('cenoura')" id="btn-cenoura">
                    <span class="emoji-loja">🥕</span> Cenoura<br>
                    <small>Custo: 2 | Lucro: 5<br>Tempo: 3s</small>
                </button>
                <button class="btn-semente" onclick="selecionarSemente('tomate')" id="btn-tomate">
                    <span class="emoji-loja">🍅</span> Tomate<br>
                    <small>Custo: 5 | Lucro: 12<br>Tempo: 6s</small>
                </button>
                <button class="btn-semente" onclick="selecionarSemente('melancia')" id="btn-melancia">
                    <span class="emoji-loja">🍉</span> Melancia<br>
                    <small>Custo: 10 | Lucro: 28<br>Tempo: 12s</small>
                </button>
            </div>
            <p class="info-loja">Semente selecionada: <strong id="semente-ativa-texto">Cenoura 🥕</strong></p>
        </section>

        <section id="campo">
            <h2>Seu Campo de Cultivo</h2>
            <div id="fazenda">
                <div class="lote" onclick="interagir(0)"><span class="icone" id="ico-0">🟫</span><span class="status-texto" id="txt-0">Vazio</span></div>
                <div class="lote" onclick="interagir(1)"><span class="icone" id="ico-1">🟫</span><span class="status-texto" id="txt-1">Vazio</span></div>
                <div class="lote" onclick="interagir(2)"><span class="icone" id="ico-2">🟫</span><span class="status-texto" id="txt-2">Vazio</span></div>
                <div class="lote" onclick="interagir(3)"><span class="icone" id="ico-3">🟫</span><span class="status-texto" id="txt-3">Vazio</span></div>
                <div class="lote" onclick="interagir(4)"><span class="icone" id="ico-4">🟫</span><span class="status-texto" id="txt-4">Vazio</span></div>
                <div class="lote" onclick="interagir(5)"><span class="icone" id="ico-5">🟫</span><span class="status-texto" id="txt-5">Vazio</span></div>
                <div class="lote" onclick="interagir(6)"><span class="icone" id="ico-6">🟫</span><span class="status-texto" id="txt-6">Vazio</span></div>
                <div class="lote" onclick="interagir(7)"><span class="icone" id="ico-7">🟫</span><span class="status-texto" id="txt-7">Vazio</span></div>
                <div class="lote" onclick="interagir(8)"><span class="icone" id="ico-8">🟫</span><span class="status-texto" id="txt-8">Vazio</span></div>
            </div>
        </section>
    </main>

    <script href="script.js" src="script.js"></script>
</body>
</html>
