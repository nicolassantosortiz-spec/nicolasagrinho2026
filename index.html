<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazenda Magnata - Mercado Dinâmico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📈 Fazenda Magnata: Edição Mercado</h1>
        <div id="painel">
            <span class="status-item moedas">🪙 Carteira: $<span id="moedas-valor">30</span></span>
        </div>
    </header>

    <main>
        <section id="mercado">
            <h2>📊 Cotação do Mercado (Venda)</h2>
            <div class="Tabela-precos">
                <div class="preco-card" id="card-batata">
                    <span class="emoji-loja">🥔</span> Batata: 
                    <strong id="preco-batata">$0</strong> <span id="tendencia-batata">--</span>
                </div>
                <div class="preco-card" id="card-abóbora">
                    <span class="emoji-loja">🎃</span> Abóbora: 
                    <strong id="preco-abóbora">$0</strong> <span id="tendencia-abóbora">--</span>
                </div>
                <div class="preco-card" id="card-cacau">
                    <span class="emoji-loja">🍫</span> Cacau: 
                    <strong id="preco-cacau">$0</strong> <span id="tendencia-cacau">--</span>
                </div>
            </div>
            <p class="aviso-mercado">⚠️ Os preços mudam a cada 7 segundos!</p>
            
            <hr>
            
            <h3>🌱 Comprar Sementes</h3>
            <div class="botoes-compra">
                <button class="btn-semente ativa" onclick="selecionarSemente('batata')" id="btn-batata">🥔 Batata ($4)</button>
                <button class="btn-semente" onclick="selecionarSemente('abóbora')" id="btn-abóbora">🎃 Abóbora ($10)</button>
                <button class="btn-semente" onclick="selecionarSemente('cacau')" id="btn-cacau">🍫 Cacau ($25)</button>
            </div>
        </section>

        <section id="campo">
            <h2>Seu Campo (<span id="semente-ativa-texto">Batata 🥔</span> selecionada)</h2>
            <div id="fazenda">
                <div class="lote" onclick="interagir(0)"><span class="icone" id="ico-0">🟫</span><span class="status-texto" id="txt-0">Vazio</span></div>
                <div class="lote" onclick="interagir(1)"><span class="icone" id="ico-1">🟫</span><span class="status-texto" id="txt-1">Vazio</span></div>
                <div class="lote" onclick="interagir(2)"><span class="icone" id="ico-2">🟫</span><span class="status-texto" id="txt-2">Vazio</span></div>
                <div class="lote" onclick="interagir(3)"><span class="icone" id="ico-3">🟫</span><span class="status-texto" id="txt-3">Vazio</span></div>
                <div class="lote" onclick="interagir(4)"><span class="icone" id="ico-4">🟫</span><span class="status-texto" id="txt-4">Vazio</span></div>
                <div class="lote" onclick="interagir(5)"><span class="icone" id="ico-5">🟫</span><span class="status-texto" id="txt-5">Vazio</span></div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
